{% extends "base.html" %}

{% block title %}Add expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add-expense.css') }}">
{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Add an expense</h1>
            <p class="auth-subtitle">Record what you spent and where it went</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input" placeholder="0.00"
                           step="0.01" min="0.01"
                           value="{{ form.get('amount', '') }}"
                           required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input form-select" required>
                        <option value="" disabled {{ 'selected' if not form.get('category') }}>Choose a category</option>
                        {% for option in categories %}
                        <option value="{{ option }}" {{ 'selected' if form.get('category') == option }}>{{ option }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input"
                           value="{{ form.get('date') or today }}"
                           max="{{ today }}"
                           required>
                </div>
                <div class="form-group">
                    <label for="description">Description <span class="form-optional">(optional)</span></label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="e.g. Lunch with team"
                           maxlength="{{ max_description_length }}"
                           value="{{ form.get('description', '') }}">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Save expense</button>
                    <a href="{{ url_for('profile') }}" class="btn-cancel">Cancel</a>
                </div>
            </form>
        </div>

    </div>
</section>

{% endblock %}
